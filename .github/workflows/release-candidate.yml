name: Signed release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  candidate:
    needs: [validate, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/checkout v7.0.1, verified GitHub tag SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.0.0, verified GitHub tag SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Verify signed tag, approved GitHub key and exact component versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_tag.py
      - name: Build twice from tagged source without lifecycle scripts or downloads
        shell: bash
        run: |
          set -euo pipefail
          npm run release:build
          version="$(node -p 'require("./package.json").version')"
          cp "dist/release/blender_pi-${version}.zip" "$RUNNER_TEMP/first-bridge.zip"
          cp "dist/release/scetrov-blender-pi-${version}.tgz" "$RUNNER_TEMP/first-package.tgz"
          # Only these two newly generated, named archives are removed for the second build.
          rm -- "dist/release/blender_pi-${version}.zip" "dist/release/scetrov-blender-pi-${version}.tgz"
          npm run release:build
          cmp "$RUNNER_TEMP/first-bridge.zip" "dist/release/blender_pi-${version}.zip"
          cmp "$RUNNER_TEMP/first-package.tgz" "dist/release/scetrov-blender-pi-${version}.tgz"
          python3 scripts/release_metadata.py \
            --commit "$(git rev-parse HEAD)" --epoch "$(git show -s --format=%ct HEAD)"
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Acquire pinned Blender and validate release ZIP
        shell: bash
        run: |
          python3 scripts/acquire_blender.py linux-x64 "$RUNNER_TEMP/blender-test"
          version="$(node -p 'require("./package.json").version')"
          "$RUNNER_TEMP/blender-test/blender-5.2.2-linux-x64/blender-5.2.2-linux-x64/blender" \
            --background --factory-startup --command extension validate \
            "dist/release/blender_pi-${version}.zip"
      # actions/attest-build-provenance v4.2.2, verified GitHub tag commit SHA, MIT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/release/*
      # actions/upload-artifact v7.0.1, verified GitHub tag SHA
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
  release-settings:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, verified GitHub tag SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject absent or unprotected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_environment.py
  publish:
    # The initial npm version is published manually after signed approval.
    # The operator enables this variable only after verifying the OIDC binding.
    if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true'
    needs: [candidate, release-settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      # actions/checkout v7.0.1, verified GitHub tag SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.0.0, verified GitHub tag SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      # actions/download-artifact v8.0.1, verified GitHub tag commit SHA, MIT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-release-candidate
          path: dist/release
      - name: Recheck approval protections, tag, registry and attested artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_environment.py
          python3 scripts/verify_release_tag.py
          (cd dist/release && sha256sum --check SHA256SUMS)
          version="$(node -p 'require("./package.json").version')"
          # Refuse any publish if this package has not been bootstrapped by the operator.
          npm view @scetrov/blender-pi version --json >/dev/null
          if npm view "@scetrov/blender-pi@${version}" version --json >/dev/null 2>&1; then
            echo 'This npm version already exists; refusing duplicate release' >&2
            exit 1
          fi
          for artifact in dist/release/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'GitHub release already exists; refusing overwrite' >&2
            exit 1
          fi
      - name: Stage unpublished GitHub draft, publish npm via trusted OIDC, then publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          # No NODE_AUTH_TOKEN or long-lived secret. npm must use the configured
          # repository/workflow/environment-bound trusted publisher or fail.
          npm publish "dist/release/scetrov-blender-pi-${version}.tgz" \
            --access public --ignore-scripts
          gh release edit "$GITHUB_REF_NAME" --draft=false
