name: OpenSSF Scorecard

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1, verified GitHub tag SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch and verify pinned OpenSSF Scorecard 5.5.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/scorecard.tar.gz" \
            https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
          echo '83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  '"$RUNNER_TEMP/scorecard.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/scorecard-cli"
          tar -xzf "$RUNNER_TEMP/scorecard.tar.gz" -C "$RUNNER_TEMP/scorecard-cli" scorecard
      - name: Evaluate checked-out revision
        shell: bash
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/scorecard-cli/scorecard" \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --commit="${GITHUB_SHA}" --format=json \
            > "$RUNNER_TEMP/scorecard.json"
          python3 - "$RUNNER_TEMP/scorecard.json" <<'PY'
          import json
          import sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"Scorecard for {result.get('repo', {}).get('commit', 'unknown')}\n\n")
              out.write(f"Overall score: {result.get('score', 'unknown')}\n\n")
              for check in result.get("checks", []):
                  out.write(f"- {check.get('name', 'unknown')}: {check.get('score', 'unknown')}\n")
          PY
      # actions/upload-artifact v7.0.1, verified GitHub tag SHA
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecard-results
          path: ${{ runner.temp }}/scorecard.json
          if-no-files-found: error
          retention-days: 30
