name: Cross-platform validation
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit-and-blender:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            python: python3
            blender: blender
          - os: windows-2022
            platform: windows-x64
            python: python
            blender: blender.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1, verified GitHub tag SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0, verified GitHub tag SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      # actions/setup-python v7.0.0, verified GitHub tag SHA
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fetch verified pnpm 12.6.0 native executable without lifecycle scripts
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          "$TEST_PYTHON" scripts/acquire_pnpm.py "$TEST_PLATFORM" "$RUNNER_TEMP/pnpm-cli"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$(cygpath -u "$RUNNER_TEMP")/pnpm-cli/pnpm.exe" install --frozen-lockfile --ignore-scripts
          else
            "$RUNNER_TEMP/pnpm-cli/pnpm" install --frozen-lockfile --ignore-scripts
          fi
      - name: Audit locked dependencies against registry advisories
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$(cygpath -u "$RUNNER_TEMP")/pnpm-cli/pnpm.exe" audit --audit-level high
          else
            "$RUNNER_TEMP/pnpm-cli/pnpm" audit --audit-level high
          fi
      - name: Static and unit validation
        shell: bash
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          ${{ matrix.python }} scripts/stage_bridge.py
          ${{ matrix.python }} scripts/validate_skills.py
          node --experimental-strip-types --test tests/unit/*.test.mjs
          ${{ matrix.python }} -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned Ubuntu EGL runtime for headless Blender
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1=1.7.0-1build1
      - name: Acquire verified Blender 5.2.2 and run headless smoke test
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_PYTHON: ${{ matrix.python }}
          TEST_BLENDER: ${{ matrix.blender }}
          # Standard hosted Windows VMs lack a verified Workbench GPU context.
          # The full capture assertion remains mandatory on Linux and local GPU runs.
          BLENDER_PI_CI_SKIP_GPU_CAPTURE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          "$TEST_PYTHON" scripts/acquire_blender.py "$TEST_PLATFORM" "$RUNNER_TEMP/blender-test"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Workbench capture needs a GL context; hosted runners have Xvfb
            # but no physical GPU. Keep the real capture assertion enabled.
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              "$TEST_PYTHON" scripts/run_blender_smoke.py "$RUNNER_TEMP/blender-test" "$TEST_PLATFORM" "$TEST_BLENDER"
          else
            "$TEST_PYTHON" scripts/run_blender_smoke.py "$RUNNER_TEMP/blender-test" "$TEST_PLATFORM" "$TEST_BLENDER"
          fi
      - name: Build and install/uninstall both release archives in private profiles
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_PYTHON: ${{ matrix.python }}
          TEST_BLENDER: ${{ matrix.blender }}
        run: |
          npm run release:build
          version="$(node -p 'require("./package.json").version')"
          "$TEST_PYTHON" scripts/verify_release_install.py \
            --archive "dist/release/blender_pi-${version}.zip" \
            --package "dist/release/scetrov-blender-pi-${version}.tgz" \
            --fixture "$RUNNER_TEMP/blender-test" --platform "$TEST_PLATFORM" --executable "$TEST_BLENDER"
