version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    reviewers: [scetrov]
    commit-message:
      prefix: "build(deps)"
    groups:
      development-tools:
        dependency-type: development
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    reviewers: [scetrov]
    commit-message:
      prefix: "ci(deps)"
